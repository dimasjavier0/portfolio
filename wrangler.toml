# Must match the Worker name in the Cloudflare dashboard (Workers Builds checks it)
name = "portfolio"
main = "worker/index.ts"
compatibility_date = "2026-10-01"

# Static site built by Vite; /api/* goes to the Worker before the assets
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# Bundle src/about-me.md as a string for the AI's fact sheet
[[rules]]
type = "Text"
globs = ["**/*.md"]
fallthrough = true

# Workers AI — used by worker/chat.ts (free tier, no API key needed)
[ai]
binding = "AI"

[observability]
enabled = true
